name: Check plugin source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify discussion engine
        run: node --test test/engine.test.mjs
      - name: Rebuild native browser bundle
        run: npm run build
      - name: Verify committed browser bundle
        run: git diff --exit-code -- lib/client.js
